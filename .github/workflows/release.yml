# Release: cross-compiled binaries + npm publish, triggered by a version tag.
#
# One tag = one config version (spec §5). Requires an NPM_TOKEN secret; inert
# inert until an NPM_TOKEN secret is set.
#
# Note: src/payload.generated.ts is git-ignored, so a fresh checkout does not
# have it. Every job runs `bun run embed` before building.
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  binaries:
    strategy:
      fail-fast: false
      # Serialized on purpose. All five jobs upload to the SAME release, and
      # softprops/action-gh-release races itself when they run concurrently:
      # v0.1.0's first run lost three binaries to "Error creating asset temp dir"
      # and one "Headers Timeout Error", even though every build succeeded.
      # Five sequential ~1min builds is a cheap price for a complete release.
      max-parallel: 1
      matrix:
        # Bun cross-compiles all targets from a single Linux runner.
        target:
          - bun-darwin-arm64
          - bun-darwin-x64
          - bun-linux-x64
          - bun-linux-arm64
          - bun-windows-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - name: Install dependencies
        run: bun install

      # payload.generated.ts is git-ignored — generate it before building.
      - name: Embed payload
        run: bun run embed

      - name: Build binary (${{ matrix.target }})
        run: bun run build:binary ${{ matrix.target }}

      # Guard: action-gh-release only WARNS when a pattern matches nothing, so a
      # naming mismatch ships a release with a missing platform and a green job.
      # v0.1.0 lost its Windows binary exactly this way.
      - name: Verify the artifact exists
        shell: bash
        run: |
          shopt -s nullglob
          found=(dist/ner-jarvis-${{ matrix.target }}*)
          if [ ${#found[@]} -eq 0 ]; then
            echo "::error::no binary produced for ${{ matrix.target }}"
            ls -la dist || true
            exit 1
          fi
          echo "will upload: ${found[*]}"

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: dist/ner-jarvis-${{ matrix.target }}*

  npm:
    runs-on: ubuntu-latest
    # `secrets` is not available in a job-level `if`, so gate the publish steps on an
    # env flag instead. Without NPM_TOKEN the job reports the skip and stays green:
    # the binaries are the primary artifact, and a missing token is a setup gap, not
    # a broken release.
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      # Node is used only for `npm publish` with an auth token.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install

      # payload.generated.ts is git-ignored — generate it before bundling.
      - name: Embed payload
        run: bun run embed

      - name: Build npm bundle
        run: bun run build:npm

      - name: Publish to npm
        if: env.HAS_NPM_TOKEN == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Report a skipped publish
        if: env.HAS_NPM_TOKEN != 'true'
        run: |
          echo "::warning::NPM_TOKEN is not set — built the npm bundle but did not publish."
          echo "Set the NPM_TOKEN repository secret and re-run this job to publish." >> "$GITHUB_STEP_SUMMARY"
